[package]
name = "tiquet"
version = "1.3.0"
description = "Tiquet: caja y tickets para comercio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tiquet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
qrcodegen = "1.8"
roxmltree = "0.20"
dirs = "6"
tauri-plugin-single-instance = "2"
tiny_http = { version = "0.12", optional = true }
tauri-plugin-autostart = "2"
zip = { version = "4.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39"
windows-core = "0.62"
schannel = "0.1"

[features]
devserver = ["dep:tiny_http"]

[[example]]
name = "devserver"
required-features = ["devserver"]

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true

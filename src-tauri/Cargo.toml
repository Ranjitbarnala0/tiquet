[package]
name = "tiquet"
version = "1.0.0"
description = "Tiquet: caja y tickets para comercio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tiquet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
chrono = "0.4"
base64 = "0.22"
dirs = "6"
tiny_http = { version = "0.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }

[features]
devserver = ["dep:tiny_http"]

[[example]]
name = "devserver"
required-features = ["devserver"]

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
